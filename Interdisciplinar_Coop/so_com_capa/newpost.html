<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Publique uma nova postagem com notícias, eventos e novidades de Witmarsum.">
    <meta name="theme-color" content="#142C21">
    <title>Nova Postagem — Witmarsum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./assets/style/index.css">
    <script src="./assets/script/main.js" defer></script>
</head>
<body>
    <div class="container">
        <div id="navbar" class="navbar"></div>
        <div id="content" class="content">
            <header class="page-head">
                <p class="kicker">Diário da colônia</p>
                <h1>Nova Postagem</h1>
                <p class="page-lede">Compartilhe notícias, eventos ou novidades sobre Witmarsum.</p>
            </header>
            <div class="posts">
                <div class="form-newpost reveal">
                    <label for="title">Título</label>
                    <input type="text" id="title" placeholder="Título da postagem" maxlength="100">
                    <label for="contentt">Conteúdo</label>
                    <textarea id="contentt" placeholder="Escreva o conteúdo da sua postagem aqui..."></textarea>
                    <label class="form-image-label">
                        <span>Anexar imagem (opcional)</span>
                        <input type="file" id="post-image" accept="image/*" />
                    </label>
                    <div id="image-preview" class="image-preview"></div>
                    <button class="btn" onclick="addPost()">Publicar</button>
                </div>
            </div>
        </div>
        <div class="footer" id="footer"></div>
    </div>
</body>
</html>
